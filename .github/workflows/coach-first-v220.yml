name: CourtIQ coach-first contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  coach-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Game Prep Hub
        run: |
          node --check prep-hub-v220.js
          node tests/test_prep_hub_v220.js
      - name: Check coach-first navigation contract
        run: |
          grep -q 'GAME PREP' nav-cleanup.js
          grep -q 'Prep Hub' nav-cleanup.js
          grep -q 'Coach Brief' nav-cleanup.js
          grep -q 'Advanced Analytics' nav-cleanup.js
          grep -q 'cq-nav-advanced-group' nav-cleanup.js
      - name: Check action routing contract
        run: |
          grep -q 'CourtIQPrepHub' app-actions-v194.js
          grep -q "name==='coach-brief'" app-actions-v194.js
          grep -q "clickId('coachBriefFlow')" app-actions-v194.js
          grep -q 'prep-hub-v220.js' index.html
      - name: Check consolidated coach action surface
        run: |
          node --check coach-surface-v221.js
          node tests/test_coach_surface_v221.js
          grep -q 'GAME PREP' coach-surface-v221.js
          grep -q 'cqCoachToolsMenu' coach-surface-v221.js
          grep -q 'coach-surface-v221.js' index.html
      - name: Check unified opponent workspace
        run: |
          node --check opponent-workspace-v222.js
          node tests/test_opponent_workspace_v222.js
          grep -q 'COURTIQ OPPONENT WORKSPACE' opponent-workspace-v222.js
          grep -q '3 VERIFIED TENDENCIES' opponent-workspace-v222.js
          grep -q 'HOW TO DEFEND' opponent-workspace-v222.js
          grep -q 'HOW TO ATTACK' opponent-workspace-v222.js
          grep -q 'CourtIQ guardrail' opponent-workspace-v222.js
          grep -q 'CourtIQOpponentWorkspace' app-actions-v194.js
          grep -q 'Opponent Workspace' nav-cleanup.js
          grep -q 'opponent-workspace-v222.js' index.html
      - name: Check opponent default selection
        run: |
          node --check opponent-default-v223.js
          node tests/test_opponent_default_v223.js
          grep -q 'courtiq_last_opponent' opponent-default-v223.js
          grep -q 'opponent-default-v223.js' index.html
      - name: Check Pregame Package
        run: |
          node --check pregame-package-v224.js
          node tests/test_pregame_package_v224.js
          grep -q 'PREGAME PACKAGE · LOCKER ROOM VIEW' pregame-package-v224.js
          grep -q '3 TO STOP' pregame-package-v224.js
          grep -q '3 TO ATTACK / TEST' pregame-package-v224.js
          grep -q '3 FIRST-QUARTER KPIs' pregame-package-v224.js
          grep -q 'PRINT PREGAME' pregame-package-v224.js
          grep -q 'pregame-package-v224.js' index.html
      - name: Check Data Quality Center
        run: |
          node --check data-quality-center-v225.js
          node tests/test_data_quality_v225.js
          grep -q 'COURTIQ DATA QUALITY CENTER' data-quality-center-v225.js
          grep -q 'INCOMPLETE games are automatically excluded' data-quality-center-v225.js
          grep -q 'CourtIQDataQuality' app-actions-v194.js
          grep -q 'data-quality-center-v225.js' index.html
      - name: Check Player Intelligence
        run: |
          node --check player-intelligence-v226.js
          node tests/test_player_intelligence_v226.js
          grep -q 'COURTIQ PLAYER INTELLIGENCE' player-intelligence-v226.js
          grep -q 'WHAT CHANGED?' player-intelligence-v226.js
          grep -q 'PLAY-END SHARE' player-intelligence-v226.js
          grep -q 'CourtIQPlayerIntelligence' app-actions-v194.js
          grep -q 'Player Intelligence' nav-cleanup.js
          grep -q 'player-intelligence-v226.js' index.html
      - name: Check scouting splits and stability
        run: |
          node --check scouting-stability-v227.js
          node tests/test_scouting_stability_v227.js
          grep -q 'SPLITS & STABILITY' scouting-stability-v227.js
          grep -q 'OUTLIER SIGNALS' scouting-stability-v227.js
          grep -q 'HOME vs AWAY' scouting-stability-v227.js
          grep -q 'CourtIQScoutingStability' scouting-stability-v227.js
          grep -q 'scouting-stability-v227.js' index.html
      - name: Check Postgame Learning Loop
        run: |
          node --check postgame-learning-v228.js
          node tests/test_postgame_learning_v228.js
          grep -q 'COURTIQ POSTGAME LEARNING' postgame-learning-v228.js
          grep -q 'EXPECTATION → ACTUAL' postgame-learning-v228.js
          grep -q 'MEMORY QUEUE' postgame-learning-v228.js
          grep -q 'PAST GAME LEARNING' postgame-learning-v228.js
          grep -q "name==='postgame'" app-actions-v194.js
          grep -q 'Postgame Review' nav-cleanup.js
          grep -q 'postgame-learning-v228.js' index.html
          grep -q 'postgame_reviews' supabase/migrations/20261010_postgame_learning_v228.sql
