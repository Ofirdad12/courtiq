name: CourtIQ coach-first contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  coach-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Game Prep Hub
        run: |
          node --check prep-hub-v220.js
          node tests/test_prep_hub_v220.js
      - name: Check coach-first navigation contract
        run: |
          grep -q 'GAME PREP' nav-cleanup.js
          grep -q 'Prep Hub' nav-cleanup.js
          grep -q 'Coach Brief' nav-cleanup.js
          grep -q 'Advanced Analytics' nav-cleanup.js
          grep -q 'cq-nav-advanced-group' nav-cleanup.js
      - name: Check action routing contract
        run: |
          grep -q 'CourtIQPrepHub' app-actions-v194.js
          grep -q "name==='coach-brief'" app-actions-v194.js
          grep -q "clickId('coachBriefFlow')" app-actions-v194.js
          grep -q 'prep-hub-v220.js' index.html
      - name: Check consolidated coach action surface
        run: |
          node --check coach-surface-v221.js
          node tests/test_coach_surface_v221.js
          grep -q 'GAME PREP' coach-surface-v221.js
          grep -q 'cqCoachToolsMenu' coach-surface-v221.js
          grep -q 'coach-surface-v221.js' index.html
      - name: Check unified opponent workspace
        run: |
          node --check opponent-workspace-v222.js
          node tests/test_opponent_workspace_v222.js
          grep -q 'COURTIQ OPPONENT WORKSPACE' opponent-workspace-v222.js
          grep -q '3 VERIFIED TENDENCIES' opponent-workspace-v222.js
          grep -q 'HOW TO DEFEND' opponent-workspace-v222.js
          grep -q 'HOW TO ATTACK' opponent-workspace-v222.js
          grep -q 'CourtIQ guardrail' opponent-workspace-v222.js
          grep -q 'CourtIQOpponentWorkspace' app-actions-v194.js
          grep -q 'Opponent Workspace' nav-cleanup.js
          grep -q 'opponent-workspace-v222.js' index.html
      - name: Check opponent default selection
        run: |
          node --check opponent-default-v223.js
          node tests/test_opponent_default_v223.js
          grep -q 'courtiq_last_opponent' opponent-default-v223.js
          grep -q 'opponent-default-v223.js' index.html
