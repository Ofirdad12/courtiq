name: Apply multi-club Edge patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: python scripts/patch_multiclub_edge.py
      - name: Validate contract
        run: |
          grep -q 'const requestedClubId=Number(body.club_id||0);' supabase/functions/import-ibba-game/index.ts
          grep -q 'onConflict:"club_id,provider,external_id"' supabase/functions/import-ibba-game/index.ts
          grep -q 'starter_verified=true' supabase/functions/import-ibba-game/index.ts
          ! grep -q 'maccabi-bnot-ashdod' supabase/functions/import-ibba-game/index.ts
          ! grep -q 'Ashdod pilot' supabase/functions/import-ibba-game/index.ts
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'CourtIQ Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/import-ibba-game/index.ts
          git commit -m 'feat(import): make official import multi-club safe'
          git push origin HEAD:${{ github.head_ref }}
