name: Patch generic FIBA importer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generalize FIBA event support
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/import-ibba-game/index.ts')
          s = p.read_text()

          old = 'if(isFiba && !/^\\/en\\/events\\/eurocup-women-\\d{2}-\\d{2}\\/games\\/\\d+-[a-z0-9-]+\\/?$/i.test(u.pathname)) throw new Error("Unsupported FIBA URL. Use an official EuroCup Women game page.");'
          new = 'if(isFiba && !/^\\/en\\/events\\/[a-z0-9][a-z0-9-]*\\/games\\/\\d+-[a-z0-9-]+\\/?$/i.test(u.pathname)) throw new Error("Unsupported FIBA URL. Use an official FIBA event game page.");'
          if old not in s:
              raise SystemExit('FIBA validation target not found')
          s = s.replace(old, new, 1)

          s = s.replace('meta.provider==="FIBA"?"FIBA EUROCUP WOMEN OFFICIAL BOX SCORE"', 'meta.provider==="FIBA"?"FIBA OFFICIAL BOX SCORE"', 1)

          marker = 'const geniusCompetition=provider==="GENIUS_LIVESTATS"?clean(String(geniusData?.competition?.name||geniusData?.competitionName||geniusData?.leagueName||"")):"";\n'
          addition = marker + '    const fibaCompetitionBase=eventSlug.replace(/-\\d{2}-\\d{2}$/i,"");\n    const fibaCompetitionName=({"eurocup-women":"EuroCup Women","fiba-europe-cup":"FIBA Europe Cup"} as Record<string,string>)[fibaCompetitionBase]||fibaCompetitionBase.split("-").filter(Boolean).map((x:string)=>x.toLowerCase()==="fiba"?"FIBA":x.charAt(0).toUpperCase()+x.slice(1)).join(" ");\n    const fibaSeason=eventSeason?"20"+eventSeason[1]+"/"+eventSeason[2]:"";\n'
          if marker not in s:
              raise SystemExit('competition marker not found')
          s = s.replace(marker, addition, 1)

          old_title = 'provider==="FIBA"?"EuroCup Women "+(eventSeason?"20"+eventSeason[1]+"/"+eventSeason[2]:"")'
          new_title = 'provider==="FIBA"?clean([fibaCompetitionName,fibaSeason].filter(Boolean).join(" "))'
          if old_title not in s:
              raise SystemExit('FIBA title target not found')
          s = s.replace(old_title, new_title, 1)

          s = s.replace('source_label:"FIBA EuroCup Women official box score"', 'source_label:title+" official box score"', 1)
          p.write_text(s)

          # Regression checks for both existing EuroCup Women and the new Europe Cup path.
          assert '/events\\/[a-z0-9][a-z0-9-]*\\/games' in s
          assert 'fiba-europe-cup' in s
          assert 'FIBA OFFICIAL BOX SCORE' in s

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/import-ibba-game/index.ts
          git commit -m "fix: support FIBA Europe Cup game URLs"
          git push
