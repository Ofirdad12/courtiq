name: CourtIQ tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: pip install -r requirements-api.txt pytest
      - name: Run Python tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
      - name: Check browser JavaScript syntax
        run: |
          node --check data.js
          node --check coach.js
          node --check app.js
          node --check app-actions-v194.js
          node --check ui-router-v194.js
          node --check players.js
          node --check mens.js
          node --check pbp-explorer.js
          node tests/test_pbp_explorer.js
          node --check decision-lab.js
          node tests/test_decision_lab.js
          node --check analytics-engine.js
          node tests/test_analytics_engine.js
          node --check player-scan.js
          node tests/test_player_scan.js
          node --check video.js
          node tests/test_video.js
          node --check game-intelligence.js
          node tests/test_game_intelligence.js
          node --check court-analytics.js
          node tests/test_court_analytics.js
          node --check lineup-engine.js
          node tests/test_lineup_engine.js
          node --check possession-engine.js
          node tests/test_possession_engine.js
          node --check rapm-engine.js
          node --check rapm-possession-bridge.js
          node tests/test_rapm_engine.js
          node tests/test_rapm_possession_bridge.js
          node --check possession-ui.js
          node --check rapm-ui.js
          node tests/test_official_demo.js
          node tests/test_season_source.js
          node --check season-workbench.js
          node tests/test_season_workbench.js
          node --check season-data-science.js
          node --check tactical-workspace.js
          node tests/test_tactical_workspace.js
          node tests/test_coach_workflow.js
          node tests/test_euroleague_import.js
          node --check basketball-intelligence.js
          node --check live-coach-intelligence.js
          node tests/test_live_coach_intelligence.js
          node --check live-bench.js
          node tests/test_live_bench.js
          node --check live-source-support.js
          node --check decision-intelligence.js
          node tests/test_decision_intelligence.js
          node --check club-os-data.js
          node --check club-os.js
          node tests/test_club_os.js
          node --check basketball-ops-data.js
          node --check basketball-ops.js
          node tests/test_basketball_ops.js
          node --check club-os-ops-extension.js
          node --check league-intelligence-data.js
          node --check league-intelligence.js
          node tests/test_league_intelligence.js
          node --check club-os-league-extension.js
          node --check scouting-report-v203.js
          node tests/test_scouting_report_v203.js
          node --check nav-cleanup.js
          node --check live-bench-entry-v198.js
          node --check workspace-controller-v201.js
          node tests/test_workspace_controller_v201.js
          node --check commercial-integrity-v212.js
          node tests/test_commercial_integrity_v212.js
          node tests/test_ui_router_contract.js
      - name: Check Supabase Edge Function contract
        run: |
          grep -q 'validateTeam' supabase/functions/import-ibba-game/index.ts
          grep -q 'import_runs' supabase/functions/import-ibba-game/index.ts
          grep -q 'validation' supabase/functions/import-ibba-game/index.ts
          grep -q 'basket.co.il' supabase/functions/import-ibba-game/index.ts
          grep -q 'WINNER_LEAGUE' supabase/functions/import-ibba-game/index.ts
          grep -q 'game-zone.asp' supabase/functions/import-ibba-game/index.ts
          grep -q 'LIVE PREVIEW' supabase/functions/live-game-preview/index.ts
          grep -q 'GENIUS_LIVESTATS' supabase/functions/live-game-preview/index.ts
          grep -q 'provider==="PLK"' supabase/functions/live-game-preview/index.ts
          grep -q 'provider==="EUROCUP"' supabase/functions/live-game-preview/index.ts
          grep -q 'akcja-po-akcji' supabase/functions/live-game-preview/index.ts
          grep -q 'api/PlayByPlay' supabase/functions/live-game-preview/index.ts
          grep -q 'api-live.euroleague.net' supabase/functions/live-game-preview/index.ts
          grep -q 'courtiq_preserve_starter_truth' supabase/migrations/20261009_starter_truth_state.sql
      - name: Check Club OS contract
        run: |
          grep -q 'club_seasons' supabase/migrations/20261006_club_os_v186.sql
          grep -q 'club_teams' supabase/migrations/20261006_club_os_v186.sql
          grep -q 'club_member_scopes' supabase/migrations/20261006_club_os_v186.sql
          grep -q 'my_club_os_context' supabase/migrations/20261006_club_os_v186.sql
          grep -q "'gm'" supabase/migrations/20261006_club_os_v186.sql
          grep -q "'scout'" supabase/migrations/20261006_club_os_v186.sql
      - name: Check Basketball Operations contract
        run: |
          grep -q 'player_identity_links' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
          grep -q 'player_360_snapshot' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
          grep -q 'basketball_ops_snapshot' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
          grep -q 'club_roster_needs' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
          grep -q 'recruitment_shortlist' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
          grep -q 'verified roster alias' supabase/migrations/20261006_player360_gm_recruitment_v187.sql
      - name: Check League Intelligence contract
        run: |
          grep -q 'IMPORTED DATASET' league-intelligence.js
          grep -q 'Percentiles reflect games currently stored in CourtIQ' league-intelligence.js
          grep -q 'executive-ui-v188.css' index.html
          grep -q 'league-intelligence.css' index.html
      - name: Check pilot activation contract
        run: |
          grep -q 'createUser' supabase/functions/create-pilot-account/index.ts
          grep -q 'pilot_invites' supabase/functions/create-pilot-account/index.ts
          grep -q 'club_members' supabase/functions/create-pilot-account/index.ts