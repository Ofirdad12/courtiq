name: CourtIQ tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: pip install -r requirements-api.txt pytest
      - name: Run Python tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
      - name: Check browser JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check players.js
      - name: Check Supabase Edge Function contract
        run: |
          grep -q 'validateTeam' supabase/functions/import-ibba-game/index.ts
          grep -q 'import_runs' supabase/functions/import-ibba-game/index.ts
          grep -q 'validation' supabase/functions/import-ibba-game/index.ts
